/*
 =========================================================
 初始化 LIFF
 =========================================================
*/
liff.init({
    liffId: LIFF_ID
})
.then(() => {
    console.log("LIFF 初始化成功");
    document.getElementById("status").innerText = "正在開啟分享對象選擇器...";

    /*
     =====================================================
     檢查登入
     =====================================================
     */
    if (!liff.isLoggedIn()) {
        liff.login();
        return null;
    }

    /*
     =====================================================
     開啟 LINE 分享對象選擇器
     =====================================================
     */
    return liff.shareTargetPicker([
        flexMessage
    ]);
})
.then((result) => {
    if (result === null) {
        return;
    }

    /*
     =====================================================
     使用者取消分享
     =====================================================
     */
    if (!result) {
        console.log("使用者取消分享");
        document.getElementById("status").innerText = "已取消分享";
        return;
    }

    /*
     =====================================================
     分享成功
     =====================================================
     */
    console.log("分享成功");
    document.getElementById("status").innerText = "分享成功！";

    /*
     =====================================================
     分享完成後關閉 LIFF
     =====================================================
     */
    setTimeout(() => {
        if (liff.isInClient()) {
            liff.closeWindow();
        }
    }, 800);
})
.catch((error) => {
    /*
     =====================================================
     錯誤處理
     =====================================================
     */
    console.error("LIFF 錯誤:", error);
    document.getElementById("status").innerText = "發生錯誤，請查看 Console";
    alert("LINE 分享發生錯誤：\n\n" + (error.message || error));
});
